# The draft release is the list of what is unreleased. Merging a pull request
# refreshes it; publishing it creates the tag that runs the Release workflow.
# The calling workflow supplies the release title: the repository name and tag.
tag-template: 'v$RESOLVED_VERSION'
change-template: '- $TITLE (#$NUMBER)'
change-title-escapes: '\<*_&'

# Labels come from the Conventional title, so nothing new to remember.
autolabeler:
  - label: breaking
    title:
      - '/^\w+(\(.+\))?!:/'
  - label: feature
    title:
      - '/^feat(\(.+\))?!?:/'
  - label: fix
    title:
      - '/^fix(\(.+\))?!?:/'
  - label: skip-changelog
    title:
      - '/^(build|chore|ci|docs|style|test)(\(.+\))?!?:/'

categories:
  # Explicit exclusions apply to both notes and versioning, even with a !.
  - type: pre-exclude
    when:
      label: skip-changelog
  # Before v1, a breaking change advances the minor version. Callers pass pre_v1.
  - type: version-resolver
    semver-increment: minor
    when:
      conventional:
        breaking: true
  - title: Added
    semver-increment: minor
    when:
      label: feature
  - title: Fixed
    semver-increment: patch
    when:
      label: fix
  - type: version-resolver
    semver-increment: patch

template: |
  $CHANGES

  https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
