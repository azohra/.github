name: Conventional PR

on:
  workflow_call:

jobs:
  title:
    name: Conventional PR title
    runs-on: ${{ vars.SHARED_WORKFLOW_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
          requireScope: false

  # The label is the title's type, written where the draft and the changelog
  # can read it. Its own job, so a labelling hiccup never blocks a merge.
  label:
    runs-on: ${{ vars.SHARED_WORKFLOW_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter/autolabeler@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        with:
          config-name: azohra/.github:release-drafter.yml@main
