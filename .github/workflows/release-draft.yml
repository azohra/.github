name: Release draft

on:
  workflow_call:
    inputs:
      pre_v1:
        description: Before v1, a breaking change advances the minor version instead of the major.
        type: boolean
        default: false

jobs:
  # The title is the repository name and the tag, the same shape goreleaser
  # writes when it attaches assets.
  draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          config-name: ${{ inputs.pre_v1 && '.github:release-drafter-pre-v1.yml' || '.github:release-drafter.yml' }}
          name: ${{ github.event.repository.name }} v$RESOLVED_VERSION
