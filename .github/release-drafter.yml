# The draft release is the list of what is unreleased. Merging a pull request
# refreshes it; publishing it creates the tag that runs the Release workflow.
# The calling workflow supplies the release title: the repository name and tag.
tag-template: 'v$RESOLVED_VERSION'
change-template: '- $TITLE (#$NUMBER)'
change-title-escapes: '\<*_&'

# Labels come from the Conventional title, one row per accepted type. cliff.toml
# beside this file carries the same table, and `mise run check` proves it.
autolabeler:
  - label: breaking
    title:
      - '/^\w+(\(.+\))?!:/'
  - label: feature
    title:
      - '/^feat(\(.+\))?!?:/'
  - label: fix
    title:
      - '/^fix(\(.+\))?!?:/'
  - label: performance
    title:
      - '/^perf(\(.+\))?!?:/'
  - label: reverted
    title:
      - '/^revert(\(.+\))?!?:/'
  - label: internal
    title:
      - '/^(build|chore|ci|docs|refactor|style|test)(\(.+\))?!?:/'

categories:
  # Explicit exclusions apply to both notes and versioning, even with a !.
  - type: pre-exclude
    when:
      label: internal
  - type: version-resolver
    semver-increment: major
    when:
      conventional:
        breaking: true
  - title: Added
    semver-increment: minor
    when:
      label: feature
  - title: Fixed
    semver-increment: patch
    when:
      label: fix
  - title: Improved
    semver-increment: patch
    when:
      label: performance
  - title: Reverted
    semver-increment: patch
    when:
      label: reverted
  - type: version-resolver
    semver-increment: patch

template: |
  $CHANGES

  https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
